services:
  postgres:
    image: postgres:16
    container_name: postgres

    environment:
      POSTGRES_USER: shareit_user
      POSTGRES_PASSWORD: shareit_password
      POSTGRES_DB: shareit

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  postgres_data: